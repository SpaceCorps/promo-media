name: Posting feeds
# Adds the posts whose time has come to the channel feeds (feeds/*.xml), which Zapier watches.
# Slots are 10:00, 15:00 and 20:00 Stockholm. GitHub delays or drops scheduled runs, so it runs every 15 minutes:
# a post enters the feeds at the first run after its slot (a run with nothing new commits nothing).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: feeds
jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/feeds.py
      - run: |
          git config user.name "spacecorps-promo"
          git config user.email "promo@users.noreply.github.com"
          git add feeds
          git diff --cached --quiet || { git commit -m "feeds: $(date -u +%FT%H:%MZ)"; git push; }
